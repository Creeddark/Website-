<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Vom Editor über das CDN zur Gastansicht"><rect width="600" height="750" fill="#F5EFE6"/><g fill="none" stroke="#4A4238" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ><rect x="90" y="40" width="420" height="118" rx="5"/><text x="300.0" y="93.0" text-anchor="middle" font-family="Inter,sans-serif" font-size="27" fill="#4A4238" stroke="none">Sie ändern etwas</text><text x="300.0" y="129.0" text-anchor="middle" font-family="Inter,sans-serif" font-size="21" fill="#AFA99E" stroke="none">im Editor</text><path d="M300 158v58"/><path d="M285 202l15 16 15-16"/><rect x="90" y="226" width="420" height="118" rx="5"/><text x="300.0" y="279.0" text-anchor="middle" font-family="Inter,sans-serif" font-size="27" fill="#4A4238" stroke="none">Seite wird erzeugt</text><text x="300.0" y="315.0" text-anchor="middle" font-family="Inter,sans-serif" font-size="21" fill="#AFA99E" stroke="none">einmal, nicht bei jedem Aufruf</text><path d="M300 344v58"/><path d="M285 388l15 16 15-16"/><rect x="90" y="412" width="420" height="118" rx="5" fill="#D4AF37" opacity="0.14" stroke="none"/><rect x="90" y="412" width="420" height="118" rx="5"/><text x="300.0" y="465.0" text-anchor="middle" font-family="Inter,sans-serif" font-size="27" fill="#4A4238" stroke="none">Auslieferung über CDN</text><text x="300.0" y="501.0" text-anchor="middle" font-family="Inter,sans-serif" font-size="21" fill="#AFA99E" stroke="none">keine Datenbank im Leseweg</text><path d="M300 530v58"/><path d="M285 574l15 16 15-16"/><rect x="90" y="598" width="420" height="118" rx="5"/><text x="300.0" y="651.0" text-anchor="middle" font-family="Inter,sans-serif" font-size="27" fill="#4A4238" stroke="none">Gast sieht die Seite</text><text x="300.0" y="687.0" text-anchor="middle" font-family="Inter,sans-serif" font-size="21" fill="#AFA99E" stroke="none">unter einer Sekunde</t